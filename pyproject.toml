[project]
name = "sentia-sidecar"
version = "0.1.0"
description = "Private local FastAPI sidecar for the Sentia editor extension"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20.0",
  "alembic>=1.16.0",
  "anthropic>=0.64.0",
  "claude-agent-sdk>=0.1.0",
  "detect-secrets>=1.5.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "openai-codex>=0.144.4",
  "pathspec>=0.12.1",
  "pydantic-settings>=2.10.0",
  "sqlalchemy[asyncio]>=2.0.40",
  "structlog>=25.4.0",
  "uvicorn[standard]>=0.35.0",
  "watchfiles>=1.1.0",
  "websockets>=16.0",
]

[project.scripts]
sentia-agent = "sentia_sidecar.agent_cli:main"
sentia-sidecar = "sentia_sidecar.cli:main"

[dependency-groups]
dev = [
  "freezegun>=1.5.0",
  "mypy>=1.17.0",
  "pre-commit>=4.3.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.0",
  "respx>=0.22.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/sidecar/src/sentia_sidecar"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
pythonpath = ["apps/sidecar/src"]
testpaths = ["apps/sidecar/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sentia_sidecar"]
mypy_path = "apps/sidecar/src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
